name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña "Actions"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          validate-wrappers: false

      - name: Build APKs
        working-directory: ./android
        run: gradle assembleDebug

      - name: Rename APKs
        working-directory: ./android/app/build/outputs/apk/debug
        run: |
          mv app-armeabi-v7a-debug.apk yaperemix-antiguo.apk
          mv app-arm64-v8a-debug.apk yaperemix-moderno.apk

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaperemix-apks
          path: |
            android/app/build/outputs/apk/debug/yaperemix-antiguo.apk
            android/app/build/outputs/apk/debug/yaperemix-moderno.apk
